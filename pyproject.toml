[project]
name = "nebra"
version = "0.1.0"
description = "Stream or send time-critical scientific data live and for free on the ATProtocol."
readme = "README.md"
authors = [{ name = "emilyhunt", email = "emily.hunt.physics@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "atproto>=0.0.72",
    "click>=8.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[project.scripts]
nebra = "nebra:main"

[project.optional-dependencies]
subscriptions = [
    "gcn-kafka>=0.3.4",
]
docs = [
    "mkdocs-material[imaging]>=9.5.0",
    "mkdocs-jupyter>=0.24.0",
    "mkdocstrings-python>=1.7.0",
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"
